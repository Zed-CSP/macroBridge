<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Streaming Bridge</title>
  <desc id="description">A retro terminal banner in cyan and magenta. Six keys route Windows desktops to OBS scenes.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173039" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#030a10" stroke-opacity=".35"/></pattern>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#42e8e0" stop-opacity=".09"/><stop offset="1" stop-color="#ff649f" stop-opacity=".07"/></linearGradient>
  </defs>
  <path fill="#080e14" d="M0 0h1200v320H0z"/>
  <path fill="url(#glow)" d="M0 0h1200v320H0z"/>
  <path fill="url(#grid)" d="M680 0h520v320H680z"/>
  <path d="M24 24h1152v272H24z" fill="none" stroke="#27434d"/>
  <path d="M24 24h18M24 24v18M1176 296h-18M1176 296v-18" fill="none" stroke="#42e8e0" stroke-width="2"/>
  <path d="M1146 24h30v30" fill="none" stroke="#ff649f" stroke-width="2"/>
  <g font-family="Consolas, 'Liberation Mono', monospace">
