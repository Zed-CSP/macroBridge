    <text x="52" y="132" fill="#e7f0f2" font-size="55" font-weight="700" letter-spacing="-2">STREAMING</text>
    <text x="358" y="132" fill="#42e8e0" font-size="55" font-weight="700" letter-spacing="-2">BRIDGE_</text>
    <text x="56" y="175" fill="#99b1bb" font-size="17">One key. Two systems. Six channels.</text>
    <g font-size="12" letter-spacing="1">
      <path d="M56 221h121v28H56zM191 221h94v28h-94zM299 221h107v28H299z" fill="#0d171f" stroke="#27434d"/>
