<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title description">
  <title id="title">Streaming Bridge routing</title>
  <desc id="description">A keyboard macro selects a saved bridge mapping. The bridge validates OBS, switches the Windows desktop, then selects the OBS program scene.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173039" stroke-width="1"/></pattern>
  </defs>
  <path fill="#080e14" d="M0 0h1200v220H0z"/>
  <path fill="url(#grid)" d="M0 0h1200v220H0z"/>
  <path d="M16 16h1168v188H16z" fill="none" stroke="#27434d"/>
  <g font-family="Consolas, 'Liberation Mono', monospace">
    <text x="36" y="37" fill="#99b1bb" font-size="11" letter-spacing="1.5">SIGNAL PATH / SAVED PROFILE</text>
    <path d="M36 54h300v112H36zM450 54h300v112H450zM864 54h300v112H864z" fill="#0d171f" stroke="#27434d"/>
    <path d="M36 54v112M450 54v112" stroke="#42e8e0" stroke-width="3"/>
    <path d="M864 54v112" stroke="#ff649f" stroke-width="3"/>
    <g fill="#42e8e0" font-size="11" letter-spacing="1">
      <text x="54" y="78">01 / KEYBOARD</text><text x="468" y="78">02 / STREAMING BRIDGE</text>
    </g>
    <text x="882" y="78" fill="#ff649f" font-size="11" letter-spacing="1">03 / WINDOWS + OBS</text>
    <g fill="#e7f0f2" font-size="22" font-weight="700">
      <text x="54" y="113">Press a macro key</text><text x="468" y="113">Validate the scene</text><text x="882" y="113">Desktop &#8594; scene</text>
    </g>
    <g fill="#99b1bb" font-size="12">
      <text x="54" y="145">Ctrl + Alt + Shift + F1&#8211;F24</text>
      <text x="468" y="145">Saved routing. Latest press wins.</text>
      <text x="882" y="145">Select desktop, then OBS program.</text>
    </g>
    <text x="36" y="190" fill="#99b1bb" font-size="11">Profile activation updates routing without changing the current desktop or OBS scene.</text>
  </g>
  <g fill="none" stroke="#42e8e0" stroke-width="2">
    <path d="M350 110h85l-7-7m7 7-7 7M764 110h85l-7-7m7 7-7 7"/>
  </g>
</svg>
