name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check publication safety
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-repository.ps1 -History
      - name: Build app and desktop helper
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build.ps1 -OutputDirectory artifacts/app
      - name: Run offline tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test.ps1
      - name: Test publication guard
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-repository-check.ps1
